<style>
:root{--bg:#eef1ec;--card:#fff;--tx:#14211c;--mu:#66736c;--bd:#d3dad5;--ac:#a8741a;--ok:#1f8f4e;--y:#c9a227;--o:#d9772b;--x:#c8402f;--n:#dfe5e1;

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1814;--card:#15241e;--tx:#eef1ec;--mu:#8a9b92;--bd:#243730;--ac:#d4a24c;--n:#22352d}}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:10px;opacity:0;transition:.2s;pointer-events:none;z-index:40}

.strip{flex:1;display:flex;gap:3px;flex-wrap:nowrap;min-width:0}.strip .chip{flex:1;min-width:0;height:28px;font-size:12px;padding:0}
.b{box-shadow:inset 0 0 0 1px #4a5a52}

#pnl{position:fixed;left:0;right:0;bottom:var(--nh,58px);max-width:480px;margin:0 auto;background:var(--card);border:1px solid var(--bd);border-radius:14px 14px 0 0;padding:8px 10px 6px;z-index:8}
.pa{display:flex;gap:6px;margin-bottom:6px}.pa button{flex:1;height:32px;border-radius:9px;border:1px solid var(--bd);background:var(--bg);font-size:13px}.pa .del{color:var(--x)}.pa .del.sure{background:var(--x);color:#fff}.pa button:disabled{opacity:.4}

.nb{width:100%;height:36px;border-radius:8px;border:0;color:#fff;font-weight:600;font-size:14px;padding:0}.nb.r{background:#c8402f}.nb.b{background:#1d2421;box-shadow:inset 0 0 0 1px #4a5a52}.nb.g{background:#1f8f4e}.nb:active{transform:scale(.9);filter:brightness(1.3)}

.hit{box-shadow:0 3px 0 0 #f5c542}.b.hit{box-shadow:inset 0 0 0 1px #4a5a52,0 3px 0 0 #f5c542}.strip{padding-bottom:3px}.hi .ball{margin-bottom:3px}
.ob{display:flex;align-items:center;gap:6px;padding:6px 0;border-top:1px solid var(--bd)}.ob:first-of-type{border-top:0}.ob .chip{height:28px;min-width:36px;font-size:14px}.chip.e{background:var(--n);color:var(--mu)}.ar{color:var(--mu)}.fl{display:flex;flex-wrap:wrap;gap:8px}.fi{display:flex;align-items:center;gap:6px;background:var(--n);border-radius:10px;padding:4px 8px}nav button{font-size:10.5px!important}
.rt{text-align:right;font-size:12px;margin-top:6px;color:var(--mu)}
.bg2.ok{background:var(--ok)}.bg2.n{background:#6f8078}nav button{padding:9px 0 8px!important;min-width:0}

.bad{background:var(--x);color:#fff;padding:8px 12px;border-radius:10px;font-size:13px;margin:8px 0}
.big{font-size:22px;font-weight:700;line-height:1.2}
.bar{display:flex;height:26px;border-radius:8px;overflow:hidden;background:var(--n);margin-top:4px;font-size:11px;color:#fff;font-weight:600}
.bar>div{display:flex;align-items:center;justify-content:center;min-width:0;overflow:hidden;white-space:nowrap}
.seg.full{display:flex}.seg.full button{flex:1}.card.sub{padding:8px 12px}</style></head><body>
<main id="v"></main><nav id="nav"></nav><div id="toast"></div><div id="ov"></div><div id="pw"></div>
<script>
const W=[0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
const P={};W.forEach((n,i)=>P[n]=i);
const RED=new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
const col=n=>n==0?'g':RED.has(n)?'r':'b';
const regA=(c,N)=>{const a=[];for(let k=-N;k<=N;k++)a.push(W[(P[c]+k+37)%37]);return a};
const R={2:[],3:[]};for(const N of[2,3])for(let c=0;c<37;c++)R[N][c]=new Set(regA(c,N));
const rng=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
const mk=(name,arr,sub)=>({name,set:new Set(arr),size:arr.length,sub});
let gt=0,at=0,btMore=0;let S=[],N=3,tab=0,scope=0,sortG=true,st=0,clr=0,hist=0,openC=null,pt='';let th=2.5,alAll=0,openW=null,pgW=1,pgAll=0;try{th=+localStorage.getItem('rt_th')||2.5}catch(e){}
try{S=JSON.parse(localStorage.getItem('rt_s')||'[]');N=3}catch(e){}
const save=()=>{try{localStorage.setItem('rt_s',JSON.stringify(S));localStorage.setItem('rt_n',N)}catch(e){}};
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1600)}
function allGroups(){
 const A=[],ad=(n,a)=>A.push(mk(n,a)),c3=k=>rng(1,36).filter(n=>n%3==k%3);
 ad('1. düzine',rng(1,12));ad('2. düzine',rng(13,24));ad('3. düzine',rng(25,36));
 ad('1. kolon',c3(1));ad('2. kolon',c3(2));ad('3. kolon',c3(0));
 ad('Kırmızı',[...RED]);ad('Siyah',rng(1,36).filter(n=>!RED.has(n)));
 ad('Tek',rng(1,36).filter(n=>n%2));ad('Çift',rng(1,36).filter(n=>n%2==0));
 ad('Alçak (1-18)',rng(1,18));ad('Yüksek (19-36)',rng(19,36));ad('Sıfır',[0]);
 ad('Voisins du Zéro',[22,18,29,7,28,12,35,3,26,0,32,15,19,4,21,2,25]);
 ad('Tiers du Cylindre',[27,13,36,11,30,8,23,10,5,24,16,33]);ad('Orphelins',[1,20,14,31,9,17,34,6]);
 for(let d=0;d<10;d++)ad('Son rakam '+d,rng(0,36).filter(x=>x%10==d));
 for(let k=0;k<12;k++)ad('Çizgi '+(3*k+1)+'-'+(3*k+3),rng(3*k+1,3*k+3));
 for(let k=0;k<11;k++)ad('Çift çizgi '+(3*k+1)+'-'+(3*k+6),rng(3*k+1,3*k+6));
 A.forEach(g=>{if(/düzine|kolon/.test(g.name))g.fix=6});
 return A}
function alertList(){return allGroups().map(g=>{const cur=gs(g,S).cur;return{name:g.name,cur,fix:g.fix,r:cur/(37/g.size)}}).filter(a=>a.fix?a.cur>=a.fix:(a.r>=th&&a.cur>=4)).sort((x,y)=>y.r-x.r)}
function setTH(v){th=v;try{localStorage.setItem('rt_th',v)}catch(e){}draw()}
function alerts(){
 if(!S.length)return '';
 const L=alertList(),sh=alAll?L:L.slice(0,3);
 return `<div class=card><h3>Uyarılar <span class="mu sm">(düzine/kolon: 6 el · diğerleri: ${th}x)</span></h3>${alAll?`<div class=seg style="margin:0 0 8px;display:inline-flex">${[2,2.5,3,4].map(v=>`<button class="${th==v?'on':''}" onclick="setTH(${v})">${v}x</button>`).join('')}</div>`:''}${L.length?sh.map(a=>`<div class=al><span><b>${a.name}</b> · ${a.cur} eldir gelmedi</span><span class="bg2 ${a.r<3?'y':a.r<4?'o':'x'}">${a.r.toFixed(1)}x</span></div>`).join('')+(L.length>3?`<button class=more onclick="alAll=!alAll;draw()">${alAll?'Daha az':'+'+(L.length-3)+' uyarı daha'}</button>`:''):'<div class="mu sm">Şu an uyarı yok.</div>'}</div>`}
function add(n){const b=alertList().map(a=>a.name);const bm=bkResolve(n);S.push(n);save();const nw=alertList().filter(a=>!b.includes(a.name));
 try{navigator.vibrate&&navigator.vibrate(nw.length?[40,60,40]:12)}catch(e){}
 draw();if(bm&&!nw.length)toast(bm);if(nw.length)toast('⚠ '+nw[0].name+': '+nw[0].cur+' eldir gelmedi'+(nw.length>1?' (+'+(nw.length-1)+')':''))}
function undo(){if(!S.length)return;const x=S.pop();const bl=BK.log[BK.log.length-1];if(bl&&bl.i===S.length){BK.pend=bl.u;BK.log.pop()}else BK.pend=0;saveBK();save();toast(x+' silindi');draw()}
function clearAll(){if(!S.length)return;if(!clr){clr=1;draw();setTimeout(()=>{if(clr){clr=0;draw()}},3000)}else{S=[];clr=0;BK.log=[];BK.pend=0;saveBK();save();toast('Tüm veri silindi');draw()}}
function setN(n){N=n;save();draw()}
function top3(h,X,n,k=1){
 const nx=[];for(let j=0;j<h.length-1;j++)if(h[j]===X)for(let q=1;q<=k&&j+q<h.length;q++)nx.push([h[j+q],j+q]);
 if(!nx.length)return null;
 let rest=nx.slice();const out=[];
 const far=c=>out.every(o=>Math.min((P[c]-P[o.c]+37)%37,(P[o.c]-P[c]+37)%37)>=2*n+1);
 const pick=pool=>{let best=null;
  for(let c=0;c<37;c++){
   if(!far(c))continue;
   let sc=0,last=-1,self=0;
   for(const[v,ix]of pool)if(R[n][c].has(v)){sc++;if(ix>last)last=ix}
   if(!sc)continue;
   for(const[v]of nx)if(v===c){self=1;break}
   const o={c,sc,last,self,d:Math.min(P[c],37-P[c])};
   if(!best||o.sc>best.sc||o.sc==best.sc&&(o.last>best.last||o.last==best.last&&(o.self>best.self||o.self==best.self&&o.d<best.d)))best=o}
  return best};
 for(let r=0;r<3;r++){
  if(!rest.length)rest=nx.slice();
  let best=pick(rest);
  if(!best)best=pick(nx);
  if(!best)break;
  out.push(best);rest=rest.filter(([v])=>!R[n][best.c].has(v))}
 return{n:nx.length,t:out,nx}}
function evalAt(i){const t=top3(S.slice(0,i),S[i-1],N);if(!t)return null;
 return{t:t.t,hit:t.t.some(o=>R[N][o.c].has(S[i])),cov:new Set(t.t.flatMap(o=>[...R[N][o.c]])).size}}
const chips=(c)=>regA(c,N).map(n=>`<span class="chip ${col(n)} ${n==c?'c':''}">${n}</span>`).join('');
function panel(){const L=S.length;let rows='';
 for(let n=0;n<=36;n++)rows+=`<button class="nb ${col(n)}" onclick=add(${n})>${n}</button>`;
 return `<div id=pnl><div class=pa><button onclick=undo() ${L?'':'disabled'}>↶ Geri Al</button><button onclick="hist=1;draw()">Geçmiş</button><button class="del ${clr?'sure':''}" onclick=clearAll()>${clr?'Emin misin?':'Temizle'}</button></div><div class=pg>${rows}</div></div>`}
function hitInfo(){const L=S.length;if(!L)return{t:null,hit:new Set()};const X=S[L-1],t=top3(S,X,N);if(!t)return{t:null,hit:new Set()};
 const cov=new Set(t.t.flatMap(o=>[...R[N][o.c]])),hit=new Set();
 for(let j=1;j<L;j++)if(S[j-1]===X&&cov.has(S[j]))hit.add(j);
 return{t,hit}}
function wide(X){
 if(X===null)return '';
 const t=top3(S,X,N,2);
 if(!t)return `<div class=card><h3>Geniş Sonraki</h3><p class=mu>${X} sayısından sonra henüz veri yok.</p></div>`;
 if(openW!==null&&!t.t.some(o=>o.c===openW))openW=null;
 const cov=new Set(t.t.flatMap(o=>[...R[N][o.c]])),hit=t.nx.filter(([v])=>cov.has(v)).length,m=t.nx.length;
 return `<div class=card><h3>Geniş Sonraki <span class="mu sm">(sonraki 2 sayı)</span></h3><div class="mu sm">${X} sonrası ${m} sayı · 3 merkez <b>${hit}/${m}</b> tutuyor (%${Math.round(hit/m*100)})</div><div class=cens>${t.t.map((o,i)=>`<button class="cen ${openW===o.c?'on':''}" onclick="openW=${openW===o.c?'null':o.c};draw()"><b class=rk>${i+1}</b><i class="ball sm ${col(o.c)}">${o.c}</i><span class="mu sm">${o.sc}/${m}</span></button>`).join('')}</div>${openW!==null?`<div class=reg><b>${openW} bölgesi:</b> ${regA(openW,N).join('-')}</div>`:''}</div>`}
function tOB(){
 const L=S.length;
 if(!L)return '<div class=top><b>Önce / Sonra</b></div>'+empty;
 const X=S[L-1],occ=[];for(let j=L-1;j>=0;j--)if(S[j]===X)occ.push(j);
 const ch=n=>n===null?'<span class="chip e">·</span>':`<span class="chip ${col(n)}">${n}</span>`;
 const rows=(pgAll?occ:occ.slice(0,12)).map((j,i)=>`<div class=ob>${ch(j>0?S[j-1]:null)}<span class=ar>→</span><i class="ball sm ${col(X)}">${X}</i><span class=ar>→</span>${ch(j<L-1?S[j+1]:null)}${i==0?'<span class="mu sm">şimdi</span>':''}</div>`).join('');
 const cn={},gd={};
 occ.forEach(j=>{for(let q=1;q<=pgW&&j+q<L;q++){const v=S[j+q];cn[v]=(cn[v]||0)+1;gd[v%10]=(gd[v%10]||0)+1}});
 const nums=Object.entries(cn).filter(([,c])=>c>=2).sort((x,y)=>y[1]-x[1]||x[0]-y[0]);
 const grp=Object.entries(gd).filter(([,c])=>c>=2).sort((x,y)=>y[1]-x[1]||x[0]-y[0]);
 const nm=["0'lar","1'ler","2'ler","3'ler","4'ler","5'ler","6'lar","7'ler","8'ler","9'lar"];
 return `<div class=top><b>Önce / Sonra</b><i class="ball sm ${col(X)}">${X}</i></div>
 ${wide(X)}<div class=card><h3>${X} öncesi ve sonrası</h3>${rows}${occ.length>12?`<button class=more onclick="pgAll=!pgAll;draw()">${pgAll?'Daha az':'Tümünü göster ('+occ.length+')'}</button>`:''}</div>
 <div class=card><h3>${X} sonrasında gelenler</h3><div class=seg style="display:inline-flex;margin-bottom:8px">${[1,2].map(v=>`<button class="${pgW==v?'on':''}" onclick="pgW=${v};draw()">Sonraki ${v} el</button>`).join('')}</div>
 <div class="mu sm" style="margin-bottom:4px">En az 2 kez gelenler</div>
 ${nums.length?`<div class=fl>${nums.map(([v,c])=>`<div class=fi><span class="chip ${col(+v)}">${v}</span><span class=sm>${c} kere</span></div>`).join('')}</div>`:'<div class="mu sm">Henüz en az 2 kez tekrar eden sayı yok.</div>'}
 <div class="mu sm" style="margin:12px 0 4px">Son rakama göre (en az 2)</div>
 ${grp.length?grp.map(([d,c])=>`<div class=al><span><b>${nm[d]}</b> <span class="mu sm">${Object.keys(cn).filter(v=>v%10==d).map(v=>v+(cn[v]>1?'×'+cn[v]:'')).join(' ')}</span></span><span class="bg2 o">${c} kez</span></div>`).join(''):'<div class="mu sm">Henüz yok.</div>'}</div>

 return top+labCard()+predCard()+`<div class=card><h3>Plus özeti</h3>${sum}<div class="mu sm" style="margin-top:8px">${T.msg}</div></div><div class=card><h3>Bakılacak sinyaller</h3>${card.join('')}<div class=al><span><b>Veri yeterliliği</b><br><span class="mu sm">${L} el · ${dv[1]}</span></span>${bd(dv[2],dv[0])}</div></div>`+reg+'<div class="mu sm" style="padding:4px 2px 12px">Oranlar sistemin geçmişteki gerçek tutma oranıdır, gelecek eli garanti etmez. Bahis başına beklenen kayıp ≈ %2,7.</div>'}

// Strateji kütüphanesi - her biri, "şu ana kadarki veriyle sonraki eli tahmin et"
const BT_STRATS = [
  {name:'Sıcak-30 (6 sayı)', fn:(arr,u)=>{

    const cnt=Array(37).fill(0);
    for(let i=u-30;i<u;i++)cnt[arr[i]]++;

  {name:'Sıcak-50 (9 sayı)', fn:(arr,u)=>{

  }},
  {name:'Soğuk-9 (en uzun gelmeyen)', fn:(arr,u)=>{

  {name:'Komşu ±4 (9 sayı)', fn:(arr,u)=>{

    const cnt=Array(37).fill(0);
    for(let i=Math.max(0,u-50);i<u;i++)cnt[P[arr[i]]]++;
    let bj=0,bs=-1;
    for(let j=0;j<37;j++){
      let s=0;for(let k=-4;k<=4;k++)s+=cnt[(j+k+37)%37];
      if(s>bs){bs=s;bj=j}
    }
    const nums=[];
    for(let k=-4;k<=4;k++)nums.push(W[(bj+k+37)%37]);
    return {nums, exp:9/37};
  }},
  {name:'Düzine Gap', fn:(arr,u)=>{
    if(u<10)return null;
    const dz=[
      {name:'1. düzine',set:new Set(rng(1,12))},
      {name:'2. düzine',set:new Set(rng(13,24))},

    let best=null,bg=0;
    for(const g of dz){

  }},
  {name:'Kolon Gap', fn:(arr,u)=>{
    if(u<10)return null;
    const kc=[
      {name:'1. kolon',set:new Set(rng(1,36).filter(n=>n%3===1))},
      {name:'2. kolon',set:new Set(rng(1,36).filter(n=>n%3===2))},

    ];

      for(let j=u-1;j>=0;j--){if(g.set.has(arr[j]))break;gap++}

  }},
  {name:'Renk Gap', fn:(arr,u)=>{
    if(u<10)return null;
    const kr={name:'Kırmızı',set:RED};
    const sy={name:'Siyah',set:new Set(rng(1,36).filter(n=>!RED.has(n)))};
    let kg=0,sg=0;
    for(let j=u-1;j>=0;j--){if(kr.set.has(arr[j]))break;kg++}
    for(let j=u-1;j>=0;j--){if(sy.set.has(arr[j]))break;sg++}
    const g=kg>=sg?kr:sy;
    return {nums:[...g.set], exp:18/37, group:g.name, gap:Math.max(kg,sg)};

  {name:'Tek/Çift Gap', fn:(arr,u)=>{

    const cf={name:'Çift',set:new Set(rng(1,36).filter(n=>n%2===0))};
    let tg=0,cg=0;
    for(let j=u-1;j>=0;j--){if(tk.set.has(arr[j]))break;tg++}
    for(let j=u-1;j>=0;j--){if(cf.set.has(arr[j]))break;cg++}
    const g=tg>=cg?tk:cf;
    return {nums:[...g.set], exp:18/37, group:g.name, gap:Math.max(tg,cg)};
  }},
  {name:'Atış İmzası ±4', fn:(arr,u)=>{
    if(u<30)return null;
    const dc=Array(37).fill(0);
    for(let i=1;i<u;i++)dc[(P[arr[i]]-P[arr[i-1]]+37)%37]++;
    let bj=0,bs=-1;
    for(let j=0;j<37;j++){
      let s=0;for(let k=-4;k<=4;k++)s+=dc[(j+k+37)%37];
      if(s>bs){bs=s;bj=j}
    }
    const nums=[];
    for(let k=-4;k<=4;k++)nums.push(W[(bj+k+37)%37]);
    return {nums, exp:9/37, diff:bj};
  }},
  {name:'36 sonrası sonu 2/3 (8 sayı)', fn:(arr,u)=>{
    if(u<1||arr[u-1]!==36)return null;
    return {nums:[2,12,22,32,3,13,23,33], exp:8/37, group:'36 sonrası sonu 2 veya 3'};
  }},
  {name:'Önceki son rakam (4 sayı)', fn:(arr,u)=>{
    if(u<1)return null;
    const d=arr[u-1]%10;
    const nums=[d,d+10,d+20,d+30].filter(n=>n<=36);
    return {nums, exp:nums.length/37, group:'önceki sayıyla aynı son rakam'};
  }},
  {name:'Önceki son rakam ±1 (8 sayı)', fn:(arr,u)=>{
    if(u<1)return null;
    const d=arr[u-1]%10, ds=[(d+9)%10,d,(d+1)%10], nums=[];
    for(const x of ds)for(let n=0;n<=36;n++)if(n%10===x&&!nums.includes(n))nums.push(n);
    return {nums, exp:nums.length/37, group:'önceki son rakamın komşu rakamları'};
  }},
  {name:'Önceki sayının aynı düzinesi (12 sayı)', fn:(arr,u)=>{
    if(u<1||arr[u-1]===0)return null;
    const d=Math.floor((arr[u-1]-1)/12);
    const nums=rng(d*12+1,d*12+12);
    return {nums, exp:12/37, group:'önceki sayının düzinesi'};
  }},
  {name:'Önceki sayının aynı kolonu (12 sayı)', fn:(arr,u)=>{
    if(u<1||arr[u-1]===0)return null;
    const c=arr[u-1]%3||3;
    const nums=rng(1,36).filter(n=>n%3===c);
    return {nums, exp:12/37, group:'önceki sayının kolonu'};
  }},
  {name:'Markov (en sık 9)', fn:(arr,u)=>{
    if(u<50)return null;
    const X=arr[u-1];
    const cnt=Array(37).fill(0);let n=0;
    for(let i=1;i<u;i++)if(arr[i-1]===X){cnt[arr[i]]++;n++}
    if(n<3)return null;
    const top=[...Array(37).keys()].sort((a,b)=>cnt[b]-cnt[a]).slice(0,9);
    return {nums:top, exp:9/37, samples:n};
  }},
];

function btRun(arr){
  const L=arr.length;
  if(L<40)return null;
  const results=BT_STRATS.map(s=>({name:s.name,hits:0,trials:0,expSum:0,streak:0,maxStreak:0,lastNums:null}));
  for(let i=40;i<L;i++){
    const actual=arr[i];
    BT_STRATS.forEach((s,si)=>{
      const r=s.fn(arr,i);
      if(!r)return;
      const hit=r.nums.includes(actual);
      const R=results[si];
      R.trials++;R.expSum+=r.exp;
      if(hit){R.hits++;R.streak++;if(R.streak>R.maxStreak)R.maxStreak=R.streak}
      else R.streak=0;
    });
  }
  return results.filter(r=>r.trials>20).map(r=>{
    const actual=r.hits/r.trials, exp=r.expSum/r.trials;
    const se=Math.sqrt(exp*(1-exp)/r.trials);
    const z=(actual-exp)/se;
    return {...r,actual,exp,z,lift:actual-exp};
  }).sort((a,b)=>b.z-a.z);
}

function btSeries(arr){
 const L=arr.length,from=Math.max(40,L-700),K=BT_STRATS.length;
 const H=BT_STRATS.map(()=>new Int8Array(L).fill(-1)),E=BT_STRATS.map(()=>new Float32Array(L)),B=BT_STRATS.map(()=>new Uint8Array(L));
 for(let i=from;i<L;i++)BT_STRATS.forEach((s,k)=>{const r=s.fn(arr,i);if(!r)return;H[k][i]=r.nums.includes(arr[i])?1:0;E[k][i]=r.exp;B[k][i]=r.nums.length});
 return{H,E,B,from,K}}
function btAdaptive(arr){
 const L=arr.length,{H,E,B,from,K}=btSeries(arr),WN=150;
 const lift=(k,a,b)=>{let s=0;for(let i=a;i<b;i++)if(H[k][i]>=0)s+=H[k][i]-E[k][i];return s};
 let hits=0,n=0,exp=0,bank=0,bets=0;
 for(let i=from+WN;i<L;i++){let bk=-1,bv=-1e9;for(let k=0;k<K;k++){if(H[k][i]<0)continue;const v=lift(k,i-WN,i);if(v>bv){bv=v;bk=k}}
  if(bk<0)continue;n++;hits+=H[bk][i];exp+=E[bk][i];bets+=B[bk][i];bank+=-B[bk][i]+(H[bk][i]?36:0)}
 let ck=0,cv=-1e9;for(let k=0;k<K;k++){const v=lift(k,Math.max(from,L-WN),L);if(v>cv){cv=v;ck=k}}
 return{n,hits,exp:n?exp/n:0,bank,bets,cur:BT_STRATS[ck].name}}
function btProfit(arr, stratName){
  const strat=BT_STRATS.find(s=>s.name===stratName);
  if(!strat)return null;
  let bank=0,plays=0,wins=0,bets=0;
  const equity=[];
  for(let i=40;i<arr.length;i++){
    const r=strat.fn(arr,i);
    if(!r)continue;
    const hit=r.nums.includes(arr[i]);
    const bet=r.nums.length;
    bank-=bet;bets+=bet;plays++;
    if(hit){bank+=36;wins++}
    equity.push(bank);
  }
  return {bank,plays,wins,bets,winRate:wins/plays,equity};
}

function btBestNow(arr){
  const r=btRun(arr);
  if(!r||!r.length)return null;
  return r.find(x=>x.z>=1.0)||null;
}

function btGroupStats(arr){
  // Kategori bazlı gerçek oran vs beklenen
  const cats={
    'Kırmızı':RED,
    'Siyah':new Set(rng(1,36).filter(n=>!RED.has(n))),
    'Tek':new Set(rng(1,36).filter(n=>n%2)),
    'Çift':new Set(rng(1,36).filter(n=>n%2===0)),
    '1-18':new Set(rng(1,18)),
    '19-36':new Set(rng(19,36)),
    '1. düzine':new Set(rng(1,12)),
    '2. düzine':new Set(rng(13,24)),
    '3. düzine':new Set(rng(25,36)),
    '1. kolon':new Set(rng(1,36).filter(n=>n%3===1)),
    '2. kolon':new Set(rng(1,36).filter(n=>n%3===2)),
    '3. kolon':new Set(rng(1,36).filter(n=>n%3===0)),
  };
  const out=[];
  for(const[name,set]of Object.entries(cats)){
    const c=arr.filter(n=>set.has(n)).length;
    const exp=arr.length*set.size/37;
    const p=set.size/37;
    const se=Math.sqrt(arr.length*p*(1-p));
    const z=(c-exp)/se;
    out.push({name,c,exp,actual:c/arr.length,expected:p,z});
  }
  return out.sort((a,b)=>b.z-a.z);
}

function btFreq(arr){
  const f=Array(37).fill(0);
  arr.forEach(n=>f[n]++);
  const exp=arr.length/37;
  return [...Array(37).keys()].map(n=>{
    const se=Math.sqrt(arr.length*(1/37)*(36/37));
    return {n,c:f[n],exp,z:(f[n]-exp)/se};
  }).sort((a,b)=>b.z-a.z);
}

 for(const e of BK.log){if(!cur)cur={a:e.i,k:0,cy:0,stk:0,mx:0,u0:e.u,T:(36-e.c)*e.u,done:0};
  cur.k++;cur.cy+=e.n;cur.stk+=e.c*e.u;if(e.u>cur.mx)cur.mx=e.u;
  if(cur.cy>=cur.T){cur.done=1;out.push(cur);cur=null}}
 if(cur)out.push(cur);return out}
function bkSpark(){
 const pts=[0];let t=0;for(const e of BK.log){t+=e.n;pts.push(t)}
 if(pts.length<2)return '<div class="mu sm">Grafik ilk bahisten sonra görünür.</div>';
 const W=300,H=84,lo=Math.min(0,...pts),hi=Math.max(0,...pts),rg=(hi-lo)||1,
 X=i=>i/(pts.length-1)*W,Y=v=>H-4-(v-lo)/rg*(H-8),
 ln=pts.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ');
 return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:84px;display:block"><line x1="0" x2="${W}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}" stroke="var(--bd)" stroke-dasharray="3 3"/><polyline points="${ln}" fill="none" stroke="${bkCl(t)}" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`}
const kt=(l,v,c)=>`<div class=kt><div class="mu sm">${l}</div><b style="color:${c||'var(--tx)'}">${v}</b></div>`;
function tKazan(){
 const z=bkZone(),st=bkState(),lim=BK.lim,c=z?z.c:21,w=36-c,rc=bkRec(z,st),sr=bkSeries(),
 op=sr.length&&!sr[sr.length-1].done?sr[sr.length-1]:null,
 base=BK.chips.includes(BK.base)?BK.base:BK.chips[0],rows=bkTable(base,c,8),lg=BK.log.slice(-10).reverse();
 let pk=0,t=0,ls=0,lsMax=0,bigU=0,hitsU=0;
 for(const e of BK.log){t+=e.n;if(t>pk)pk=t;if(e.h)ls=0;else{ls++;if(ls>lsMax)lsMax=ls}if(e.u>bigU)bigU=e.u}
 const maxK=sr.reduce((m,s)=>Math.max(m,s.k),0),maxKat=sr.reduce((m,s)=>Math.max(m,s.mx/s.u0),0),
 stop=lim>0&&st.tot<=-lim,
 fl=op?op.cy:0,
 H=`<div class=top><b>Kazan</b><span class="mu sm">${st.n} bahis · ${st.closed} seri kapandı</span></div>`;
 let h=H;
 // 1. anlık durum
 h+=`<div class=card><div class=kg2><div><div class="mu sm">Toplam net</div><div style="font-size:30px;font-weight:700;color:${bkCl(st.tot)}">${bkFm(st.tot)}</div><div class="mu sm">birim</div></div>
 <div><div class="mu sm">${op?(fl<0?'Anlık kayıp (açık seri)':fl>0?'Anlık kazanç (açık seri)':'Açık seri neti'):'Açık seri'}</div><div style="font-size:30px;font-weight:700;color:${op?bkCl(fl):'var(--mu)'}">${op?bkFm(fl):'Yok'}</div><div class="mu sm">${op?`hedef +${op.T} · kalan ${op.T-op.cy}`:'ilk birimi Ana ekranda seç'}</div></div></div>
 <div style="margin-top:10px">${bkSpark()}</div><div class="mu sm">Toplam net grafiği · ${st.n} bahis</div></div>`;
 // 2. bu el
 if(stop)h+=`<div class=card style="border:2px solid var(--x)"><b style="color:var(--x);font-size:20px">DUR · zarar limiti doldu</b><div class="mu sm">${bkFm(st.tot)} / −${lim}</div></div>`;
 else if(rc&&op){
  const amt=rc.amt,kat=amt/op.u0,win=op.cy+w*amt,lossCy=op.cy-c*amt,nx=bkAmt(Math.max(1,Math.ceil((op.T-lossCy)/w))),over=lim>0&&st.tot-amt*c<=-lim;
  h+=`<div class=card style="border:2px solid var(--ac)"><h3>Bu el: ${amt} birim <span class="mu sm">(${bkTxt(rc.parts)})</span></h3>
  <div class=kg>${kt('Katlama','×'+(Math.round(kat*10)/10)+' · '+(op.k+1)+'. el')}${kt('Yatırılacak',amt*c+' ('+c+' sayı)')}
  ${kt('Tutarsa',bkFm(win)+(win>=op.T?' · seri kapanır':''),'var(--ok)')}${kt('Tutmazsa',bkFm(lossCy),'var(--x)')}
  ${kt('Seride toplam yatırım',op.stk+amt*c)}${kt('Tutmazsa sonraki el',nx+' birim (×'+(Math.round(nx/op.u0*10)/10)+')','var(--o)')}</div>
  ${over?`<div style="color:var(--x);font-size:13px;margin-top:6px"><b>Bu tutar zarar limitini aşar.</b></div>`:''}
  ${lim>0?`<div class="mu sm" style="margin-top:6px">Tutmazsa toplam net ${bkFm(st.tot-amt*c)} · limite kalan ${Math.max(0,lim+st.tot-amt*c)}</div>`:''}</div>`}
 else h+=`<div class=card><h3>Bu el</h3><div class="mu sm">Açık seri yok. Aşağıdaki tabloda ilk birimi seç, Ana ekranda o birimi koy. ${z?'':'Bölge için veri yok.'}</div></div>`;
 // 3. istatistik
 h+=`<div class=card><h3>Tüm veriler</h3><div class=kg>
 ${kt('Tutan / tutmayan',st.hits+' / '+(st.n-st.hits)+(st.n?' (%'+Math.round(st.hits/st.n*100)+')':''))}
 ${kt('Yatırılan toplam',st.stk.toLocaleString('tr-TR'))}
 ${kt('Getiri',st.stk?bkFm(Math.round(st.tot/st.stk*1000)/10)+'%':'–',bkCl(st.tot))}
 ${kt('En yüksek kâr',bkFm(pk),'var(--ok)')}
 ${kt('En derin düşüş','−'+st.mdd,'var(--x)')}
 ${kt('En uzun kaçırma',lsMax+' el')}
 ${kt('En çok katlama',maxK?maxK+' el · ×'+(Math.round(maxKat*10)/10):'–')}
 ${kt('En büyük bahis',bigU?bigU+' birim':'–')}
 ${kt('Kapanan seri',st.closed+(op?' (+1 açık)':''))}
 </div></div>`;
 // 4. limit
 h+=`<div class=card><h3>Zarar limiti</h3><div class=cens style="flex-wrap:wrap;margin-top:0">${KL.map(v=>`<button class="cen ${lim===v?'on':''}" style="min-width:52px" onclick="bkLim(${v})">${v||'Kapalı'}</button>`).join('')}</div>
 ${lim>0?`<div class=trk style="margin-top:8px"><div class="fill ${st.tot<=-lim?'x':st.tot<-lim*.5?'o':'ok'}" style="width:${Math.max(4,Math.min(100,(-st.tot)/lim*100))}%;color:#fff">${st.tot<0?-st.tot:0}</div></div><div class="mu sm">Kalan: <b>${Math.max(0,lim+st.tot)}</b> / ${lim} birim</div>`:'<div class="mu sm" style="margin-top:6px">Limit kapalı.</div>'}</div>`;
 // 5. tablo
 h+=`<div class=card><h3>Bu boyutla ne olur?</h3><div class="mu sm">İlk birim · ${c} sayı · hedef +${w*base}</div><div class=cens style="flex-wrap:wrap">${BK.chips.map(u=>`<button class="cen ${base===u?'on':''}" style="min-width:52px" onclick="bkBase(${u})">${u}</button>`).join('')}</div>
 <div style="overflow-x:auto;margin-top:8px"><table style="width:100%;border-collapse:collapse;font-size:12px;text-align:right"><tr class=mu><th style="text-align:left">El</th><th>Birim</th><th>Kat</th><th>Toplam yatırım</th><th>Tutarsa</th><th>Gelme</th></tr>${rows.map(r=>{const cur=op&&op.u0===base&&r.k===op.k+1;return `<tr style="border-top:1px solid var(--bd);${lim>0&&r.loss>lim?'color:var(--x);':''}${cur?'background:var(--n);font-weight:700':''}"><td style="text-align:left">${r.k}${cur?' ◀':''}</td><td><b>${r.u}</b><div class="mu" style="font-size:10px">${bkTxt(r.parts)}</div></td><td>×${Math.round(r.u/base*10)/10}</td><td>${r.loss}</td><td style="color:var(--ok)">${bkFm(r.win)}</td><td>%${(r.p*100).toFixed(1)}</td></tr>`}).join('')}</table></div>
 <div class="mu sm" style="margin-top:6px">"Toplam yatırım" o el de tutmazsa toplam kaybındır. ${lim>0?'Kırmızı satırlar zarar limitini aşar. ':''}Birimler seçili birimlere yuvarlanır. Tablo ihtimali değiştirmez, kaybı büyüterek kurtarmanın bedelini gösterir.</div></div>`;
 // 6. seriler
 const ls8=sr.slice(-8).reverse();
 h+=`<div class=card><h3>Seriler</h3>${ls8.length?`<table style="width:100%;border-collapse:collapse;font-size:12px;text-align:right"><tr class=mu><th style="text-align:left">Seri</th><th>El</th><th>En yüksek</th><th>Yatırım</th><th>Net</th></tr>${ls8.map((s,i)=>`<tr style="border-top:1px solid var(--bd)"><td style="text-align:left">${sr.length-i}${s.done?' ✔':' ⏳'}</td><td>${s.k}</td><td>${s.mx} <span class=mu>(×${Math.round(s.mx/s.u0*10)/10})</span></td><td>${s.stk}</td><td style="color:${bkCl(s.cy)}">${bkFm(s.cy)}</td></tr>`).join('')}</table>`:'<div class="mu sm">Henüz seri yok.</div>'}</div>`;
 // 7. son bahisler
 h+=`<div class=card><h3>Son bahisler</h3>${lg.length?`<table style="width:100%;border-collapse:collapse;font-size:12px;text-align:right"><tr class=mu><th style="text-align:left">El</th><th>Sayı</th><th>Birim</th><th>Sonuç</th><th>Net</th></tr>${lg.map(e=>`<tr style="border-top:1px solid var(--bd)"><td style="text-align:left">${e.i+1}</td><td>${e.x}→${e.v}</td><td>${e.u}</td><td>${e.h?'✔':'✖'}</td><td style="color:${bkCl(e.n)}">${bkFm(e.n)}</td></tr>`).join('')}</table>`:'<div class="mu sm">Henüz bahis yok.</div>'}
 <div class=cens><button class=cen onclick="bkChipsSet()">Birimleri ayarla (${BK.chips.join('-')})</button>${st.n?`<button class=cen style="color:var(--x)" onclick="bkReset()">Kaydı sıfırla</button>`:''}</div></div>`;
 return h}
